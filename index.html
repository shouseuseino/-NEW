<!DOCTYPE html>

<!-- このページは日本語のページですよ、という設定 -->
<html lang="ja">

<head>

  <!-- 日本語が文字化けしないようにする設定 -->
  <meta charset="UTF-8">

  <!-- スマホでも画面サイズが正しく表示されるようにする設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ブラウザのタブに表示される名前 -->
  <title>福岡コレクション</title>

  <!--
    ホーム画面専用のデザインファイルを読み込む
    次に「home.css」というファイルを作ります
  -->
  <link rel="stylesheet" href="home.css">

</head>


<body>

  <!-- ================================
       ホーム画面全体
       ================================ -->
  <main class="home">


    <!-- ================================
         ロゴを表示する場所
         ================================ -->
    <div class="logo-area">

   <!-- ================================
     福岡コレクションのロゴ画像
     imagesフォルダのlogo.pngを表示する
     ================================ -->

<img
  src="images/logonew.png"
  alt="福岡コレクション"
  class="home-logo"
>

    </div>


    <!-- ================================
         ボタンを置く場所
         ================================ -->
    <div class="menu-buttons">

     <!-- =================================
     ステージ選択ボタン
     画像全体をクリックできるようにする
     ================================= -->

<a href="stage-select.html" class="stage-button">

  <!--
    imagesフォルダのstage-button.pngを表示する
  -->
  <img
    src="images/stage-button.png"
    alt="ステージ選択"
    class="stage-button-image"
  >

</a>

    </div>


  </main>

</body>

</html>
