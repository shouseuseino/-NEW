
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <!-- スマホ対応 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ジャンル選択 | 福岡コレクション</title>

  <style>

    /* サイズ計算の基本設定 */
    * {
      box-sizing: border-box;
    }

    /* 背景画像：今までの背景をそのまま使用 */
    body {
      margin: 0;
      min-height: 100vh;
      font-family: sans-serif;

      background-image: url("images/stage-background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* 画面全体の配置 */
    .container {
      min-height: 100vh;
      padding: 20px 15px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      /* タイトル・ボタン一覧の間隔 */
      gap: 20px;
    }

    /* =================================
       ジャンル選択タイトル画像
       ================================= */

    .title-image {
      width: 480px;
      max-width: 85vw;
      height: auto;
      display: block;
    }

    /* =================================
       ジャンルボタン一覧
       ================================= */

    .genre-list {
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      /* ボタン同士の間隔 */
      gap: 8px;
    }

    /* ジャンルボタンの大きさ */
    .genre-button {
      display: block;
      width: 480px;
      max-width: 90vw;
      text-decoration: none;
    }

    /* ボタン画像の表示設定 */
    .genre-button img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 選択可能なボタン */
    .available {
      cursor: pointer;
    }

    /* 未解放ボタン */
    .locked {
      cursor: not-allowed;
    }

    /* =================================
       ホームに戻るボタン
       ================================= */

    .back-button {
      display: block;
      width: 180px;
      max-width: 50vw;
    }

    .back-button img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* =================================
       スマホ画面用の調整
       ================================= */

    @media (max-width: 600px) {

      .container {
        padding: 20px 10px;
        gap: 15px;
      }

      .title-image {
        width: 340px;
      }

      .genre-button {
        width: 360px;
      }

      .genre-list {
        gap: 10px;
      }

      .back-button {
        width: 150px;
      }

    }

    /* =================================
   タイトルとボタンのサイズ調整
   ================================= */

/* ジャンル選択タイトル */
.title-image {
  width: 600px;
  max-width: 85vw;
}

/* ラーメン・未解放ボタン */
.genre-button {
  width: 600px;
  max-width: 90vw;
}

/* ホームに戻るボタン */
.back-button {
  width: 225px;
  max-width: 50vw;
}

/* スマホ画面のサイズ調整 */
@media (max-width: 600px) {
  .title-image {
    width: 380px;
  }

  .genre-button {
    width: 420px;
  }

  .back-button {
    width: 180px;
  }
}
  </style>
</head>

<body>

  <main class="container">

    <!-- ジャンル選択タイトル -->
    <img
      src="images/genre-title.png"
      alt="GENRE SELECT"
      class="title-image">

    <!-- ジャンルボタン一覧 -->
    <div class="genre-list">

      <!-- ラーメン：エリア選択画面に移動 -->
      <a href="ramen-area.html"
         class="genre-button available">

        <img
          src="images/ramen-button.png"
          alt="RAMEN">

      </a>

      <!-- 未解放ジャンル 2 -->
      <div class="genre-button locked">
        <img
          src="images/locked-button.png"
          alt="COMING SOON">
      </div>

      <!-- 未解放ジャンル 3 -->
      <div class="genre-button locked">
        <img
          src="images/locked-button.png"
          alt="COMING SOON">
      </div>

      <!-- 未解放ジャンル 4 -->
      <div class="genre-button locked">
        <img
          src="images/locked-button.png"
          alt="COMING SOON">
      </div>

    </div>

    <!-- ホーム画面に戻る -->
    <a href="index.html" class="back-button">

      <img
        src="images/home-button.png"
        alt="HOME">

    </a>

  </main>

</body>
</html>
