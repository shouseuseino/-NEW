    /* ================================
       全体
    ================================= */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #7ccf63;
      color: #0d2b26;
    }


    /* ================================
       画面全体の箱
    ================================= */
    .game-screen {
      width: 100%;
      min-height: 100vh;
      padding: 18px;
    }

/* ================================
   上のヘッダー
================================= */
.header {
  display: grid;
  grid-template-columns: 1fr 1.3fr auto;
  gap: 16px;
  align-items: center;
  margin-bottom: 18px;
}


/* ================================
   福岡コレクションロゴ
================================= */
.logo-box {
  display: flex;
  justify-content: center;
  align-items: center;
}

.logo-image {
  width: 100%;
  max-width: 360px;
  height: auto;
  display: block;
}


/* ================================
   ステージ1画像
================================= */
.stage-title {
  display: flex;
  justify-content: center;
  align-items: center;
}

.stage-image {
  width: 100%;
  max-width: 420px;
  height: auto;
  display: block;
}


/* ================================
   右上ボタン
================================= */
.header-buttons {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.header-button {
  display: inline-block;

  text-decoration: none;
  text-align: center;

  background: #fff5cf;
  color: #0d2b26;

  border: 5px solid #123c34;

  padding: 14px 18px;

  font-size: 17px;
  font-weight: bold;

  box-shadow: 0 5px 0 #123c34;

  transition: 0.1s;
}


/* 押した時の動き */
.header-button:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #123c34;
}
   

    /* ================================
       メイン部分
       左：地図
       右：達成度＋スポット一覧
    ================================= */
    .main-area {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 18px;
    }


    /* ================================
       左側：白地図を入れる欄
    ================================= */
    .map-panel {
      min-height: 650px;
      background: #0e4b3e;
      border: 6px solid #123c34;
      padding: 16px;
      position: relative;
    }


    /* あとで白地図を入れる場所 */
    .map-placeholder {
      width: 100%;
      height: 100%;
      min-height: 610px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 28px;
      font-weight: bold;
      text-align: center;
    }


    /* ================================
       右側
    ================================= */
    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    

    /* ================================
       達成度
    ================================= */
    .progress-panel {
      background: #fff8df;
      border: 6px solid #123c34;
      padding: 22px;
    }

    .progress-panel h2 {
      margin-top: 0;
      font-size: 26px;
    }

    .percent {
      font-size: 64px;
      font-weight: bold;
      text-align: right;
      margin: 10px 0;
    }

    .progress-bar {
      width: 100%;
      height: 30px;
      border: 5px solid #123c34;
      background: #c8d1cf;
      overflow: hidden;
    }

    /* 今は0%なので幅0 */
    .progress-fill {
      width: 0%;
      height: 100%;
      background: #55c85d;
    }

    .spot-count {
      text-align: right;
      margin-top: 12px;
      font-size: 20px;
      font-weight: bold;
    }


    /* ================================
       スポット一覧
    ================================= */
    .spot-panel {
      background: #8ddd72;
      border: 6px solid #123c34;
      padding: 18px;
      flex: 1;
    }

    .spot-panel h2 {
      margin-top: 0;
      font-size: 26px;
    }

   .spot-list {

  flex-direction: column;
  gap: 12px;

  /* 一覧だけスクロールできる */
  max-height: 430px;
  overflow-y: auto;

  padding-right: 6px;
}

      border: 3px solid #d9c88f;
      padding: 16px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      font-size: 20px;
      font-weight: bold;
    }

    .spot-status {

      font-size: 16px;
    }

       スマホ対応
    ================================= */

        grid-template-columns: 1fr;

  justify-content: center;

/* ================================

================================= */

  height: 95%;

  position: relative;

/* ================================

.map-placeholder {

/* ================================
   元の白地図画像

  height: 90%;

/* ================================

================================= */
#pixel-map {
  width: 90%;
  height: 90%;

  display: grid;

  /* JavaScriptから列数を決める */

}


/* ================================

================================= */
.map-cell {
  width: 100%;
  height: 100%;

  background: transparent;

  border: 0.5px solid rgba(90, 170, 190, 0.22);
}


/* 福岡県の中にある白マス */
.map-cell.land {
  background: #f5f5ed;

  border: 0.5px solid rgba(190, 190, 180, 0.55);

/* 取得済みの場所 */
.map-cell.active {

}


/* 緑にする時に追加するクラス */

// ========================================
// 選択したマスを保存
// ========================================

let selectedArea = [];
let isDrawing = false;


// ========================================
// 白地図画像が読み込まれたら
// ドット地図を作成
// ========================================

mapImage.onload = function () {
  createPixelMap();
};


// 画像がすでに読み込み済みだった場合にも対応
if (mapImage.complete) {
  createPixelMap();
}


// ========================================
// ドット地図を作る
// ========================================

function createPixelMap() {

  // 二重作成を防ぐ
  pixelMap.innerHTML = "";

  const ratio =
    mapImage.naturalHeight / mapImage.naturalWidth;

  const rows =
    Math.round(columns * ratio);

  pixelMap.style.gridTemplateColumns =
    `repeat(${columns}, 1fr)`;

  pixelMap.style.gridTemplateRows =
    `repeat(${rows}, 1fr)`;


  // 白地図画像を一時的なCanvasへ描画
  const canvas =
    document.createElement("canvas");

  canvas.width = columns;
  canvas.height = rows;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    mapImage,
    0,
    0,
    columns,
    rows
  );

  const imageData =
    ctx.getImageData(
      0,
      0,
      columns,
      rows
    );

  const pixels =
    imageData.data;


  // マスを作成
  for (let y = 0; y < rows; y++) {

    for (let x = 0; x < columns; x++) {

      const index =
        (y * columns + x) * 4;

      const red = pixels[index];
      const green = pixels[index + 1];
      const blue = pixels[index + 2];
      const alpha = pixels[index + 3];

      const cell =
        document.createElement("div");

      cell.classList.add("map-cell");

      cell.dataset.x = x;
      cell.dataset.y = y;


      // 福岡県内かどうか判定
      const isWhite =
        red > whiteThreshold &&
        green > whiteThreshold &&
        blue > whiteThreshold &&
        alpha > 50;

      if (isWhite) {
        cell.classList.add("land");
      }

      pixelMap.appendChild(cell);
    }
  }
}


// ========================================
// マリンワールド取得
// ========================================

function getMarineWorld() {

  marineWorldArea.forEach(([x, y]) => {

    const cell = document.querySelector(
      `.map-cell[data-x="${x}"][data-y="${y}"]`
    );

    if (cell && cell.classList.contains("land")) {
      cell.style.backgroundColor = "";
      cell.classList.add("active");
    }
  });

  // 10番目のスポットを公開
  document.getElementById("spot10-name").textContent =
    "マリンワールド海の中道";

  document.getElementById("spot10-status").textContent =
    "● GET!";

  // 11スポット中1個取得
  document.querySelector(".percent").textContent =
    "9%";

  document.querySelector(".progress-fill").style.width =
    "9%";

  document.querySelector(".spot-count").textContent =
    "1 / 11 スポット";
}


// ========================================
// マウスで範囲選択
// ========================================

pixelMap.addEventListener(
  "mousedown",
  function (event) {

    isDrawing = true;

    paintCell(event.target);
  }
);


pixelMap.addEventListener(
  "mousemove",
  function (event) {

    if (!isDrawing) {
      return;
    }

    paintCell(event.target);
  }
);


document.addEventListener(
  "mouseup",
  function () {

    isDrawing = false;
  }
);


// ========================================
// 選択したマスを赤くする
// ========================================

function paintCell(cell) {

  if (!cell.classList.contains("map-cell")) {
    return;
  }

  if (!cell.classList.contains("land")) {
    return;
  }

  const x =
    Number(cell.dataset.x);

  const y =
    Number(cell.dataset.y);


  // 同じ座標を2回保存しない
  const exists =
    selectedArea.some(
      ([px, py]) =>
        px === x && py === y
    );

  if (exists) {
    return;
  }


  selectedArea.push([x, y]);

  // 選択中は赤
  cell.style.backgroundColor = "red";
}


// ========================================
// 選択した範囲をコピー
// ========================================

async function showSelectedArea() {

  if (selectedArea.length === 0) {

    alert(
      "まだ範囲が選択されていません。地図を赤く塗ってから押してください。"
    );

    return;
  }


  let result =
    "const marineWorldArea = [\n";

  selectedArea.forEach(([x, y]) => {

    result +=
      `  [${x}, ${y}],\n`;
  });

  result += "];";


  try {

    await navigator.clipboard.writeText(result);

    alert(
      selectedArea.length +
      "マスの座標をコピーしました！"
    );

  } catch (error) {

    // Safariなどでコピーできない場合
    prompt(
      "⌘Cでコピーしてください",
      result
    );
  }
}
