
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <!-- スマホでも画面幅に合わせて表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>福岡市ラーメン | 福岡コレクション</title>

  <style>
    /* ===== 色や背景の設定 ===== */
    :root {
      --main-color: #3c7651;
      --light-color: #e8f4e8;
      --text-color: #264b39;

      /* 背景画像は後から設定できる */
      --game-background: none;
    }

    /* ===== ページ全体 ===== */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: sans-serif;
      color: var(--text-color);

      background-color: #d9edda;
      background-image: var(--game-background);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* ===== 上部のロゴ ===== */
    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 20px;
      max-width: 1300px;
      margin: auto;
    }

    .game-logo {
      width: min(260px, 55%);
      height: auto;
    }

    .stage-title {
      padding: 12px 20px;
      background: white;
      border: 3px solid var(--main-color);
      border-radius: 15px;
      font-weight: bold;
    }

    /* ===== 地図と店舗一覧の配置 ===== */
    .main-area {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 20px;
      max-width: 1300px;
      margin: 10px auto;
      padding: 0 20px;
      align-items: start;
    }

    /* ===== 地図エリア ===== */
    .map-panel {
      background: white;
      border: 4px solid var(--main-color);
      border-radius: 22px;
      padding: 20px;
      min-height: 570px;
    }

    .map-panel h2 {
      text-align: center;
      margin-top: 0;
    }

    /* 後から福岡市のドット地図をここに表示する */
    .map-area {
      width: 100%;
      min-height: 450px;
      background: #f5faf5;
      border: 2px dashed #9cbea5;
      border-radius: 15px;

      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .map-message {
      color: #789681;
      line-height: 1.8;
    }

    /* ===== 右側の情報エリア ===== */
    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .progress-panel,
    .shop-panel {
      background: white;
      border: 4px solid var(--main-color);
      border-radius: 22px;
      padding: 20px;
    }

    /* ===== 達成度 ===== */
    .progress-panel h2 {
      margin-top: 0;
    }

    .progress-number {
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      margin: 15px 0;
    }

    .progress-bar {
      width: 100%;
      height: 22px;
      background: #d9e5da;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #64bb70;
      transition: width 0.3s;
    }

    /* ===== ラーメン店舗一覧 ===== */
    .shop-panel h2 {
      margin-top: 0;
    }

    .shop-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 350px;
      overflow-y: auto;
    }

    .shop-item {
      padding: 12px;
      margin-bottom: 8px;
      background: var(--light-color);
      border-radius: 10px;
      font-weight: bold;
    }

    .shop-item::before {
      content: "□ ";
      color: var(--main-color);
    }

    /* 訪問済み店舗に適用するデザイン */
    .shop-item.completed {
      background: #c0e9c3;
    }

    .shop-item.completed::before {
      content: "✓ ";
    }

    /* ===== QR読み取りボタン ===== */
    .qr-button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 14px;
      background: var(--main-color);
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    /* 機能を作るまでは押せない状態にする */
    .qr-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ===== 戻るボタン ===== */
    .back-area {
      max-width: 1300px;
      margin: 20px auto 40px;
      padding: 0 20px;
    }

    .back-button {
      display: inline-block;
      padding: 14px 24px;
      background: white;
      border: 3px solid var(--main-color);
      border-radius: 15px;
      color: var(--text-color);
      text-decoration: none;
      font-weight: bold;
    }

    /* ===== スマホ対応 ===== */
    @media (max-width: 850px) {
      .game-header {
        padding: 15px;
      }

      .stage-title {
        padding: 10px;
        font-size: 13px;
      }

      .main-area {
        grid-template-columns: 1fr;
        padding: 0 12px;
      }

      .map-panel {
        min-height: auto;
        padding: 12px;
      }

      .map-area {
        min-height: 350px;
      }

      .progress-panel,
      .shop-panel {
        padding: 15px;
      }
    }
    /* ===== 福岡市ドット地図 ===== */

/* 地図を表示するエリア */
.map-area {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 450px;
}

/* ドット地図全体 */
/* ===== ドット地図を中央に配置 ===== */
#pixel-map {
  display: grid;

  /* 地図の横幅 */
  width: 100%;
  max-width: 600px;
  height: auto;

  /* 地図の高さはJavaScriptで調整 */
  aspect-ratio: 1;

  /* 地図を中央に配置 */
  margin: 0 auto;

  gap: 0;
}

/* 地図を構成する1マス */
.map-cell {
  background: transparent;
  min-width: 0;
  min-height: 0;
}

/* 福岡市の内側だけ白色にする */
.map-cell.land {
  background: white;
}

/* 地図の読み込み状態 */
#map-status {
  color: #789681;
  text-align: center;
}

/* スマホ対応 */
@media (max-width: 850px) {
  #pixel-map {
    max-width: 100%;
  }
}
  /* 訪問済みのマスとQR読み取り画面 */
.map-cell.land { box-shadow: inset 0 0 0 0.25px #a3bca0; }
.map-cell.land.visited { background: #63c856; }
#qr-reader { width:100%; max-width:360px; margin:10px auto; }
#qr-panel[hidden] { display:none; }
#qr-message { overflow-wrap:anywhere; }

/* =================================
   ゲーム画面の夜景背景
   ================================= */

body {
  /* 背景画像 */
  background: url("images/ramen-game-bg.png")

/* ========================================
   レトロゲーム風の金色フレーム

/* 地図・達成度・店舗一覧の共通設定 */
.map-panel,
.progress-panel,
.shop-panel {

  /* 枠の内側のクリーム色 */
  background: #fff5d6;

/* ========================================

.map-area {

/* 地図のタイトル */

/* ========================================
   スマホ画面用の調整
   ======================================== */

@media (max-width: 850px) {

  .map-panel,

    border-width: 16px;

  }

}
/* ========================================
   レトロゲーム風の太い金色ドットフレーム
   ======================================== */

.map-panel,
.progress-panel,
.shop-panel {

  /* 枠の内側のクリーム色 */
  background: #fff5d6;
  background-clip: padding-box;

  /* 今までの枠画像を無効にする */
  border-image: none;

  /* 太い金色の枠 */
  border: 8px solid #ffd45c;
  border-radius: 0;

  /* 金色と紺色を重ねて立体感を出す */
  box-shadow:
    0 0 0 4px #a76b24,
    0 0 0 8px #10172e,
    inset 0 0 0 4px #fff0a1,
    inset 0 0 0 8px #b17b30,
    inset 0 0 0 12px #172044;

  /* 四隅を階段状にする */
  clip-path: polygon(
    0 16px,
    8px 16px,
    8px 8px,
    16px 8px,
    16px 0,
    calc(100% - 16px) 0,
    calc(100% - 16px) 8px,
    calc(100% - 8px) 8px,
    calc(100% - 8px) 16px,
    100% 16px,
    100% calc(100% - 16px),
    calc(100% - 8px) calc(100% - 16px),
    calc(100% - 8px) calc(100% - 8px),
    calc(100% - 16px) calc(100% - 8px),
    calc(100% - 16px) 100%,
    16px 100%,
    16px calc(100% - 8px),
    8px calc(100% - 8px),
    8px calc(100% - 16px),
    0 calc(100% - 16px)
  );

  /* 枠と中身の間隔 */
  padding: 24px;
}

/* スマホ画面用の余白調整 */
@media (max-width: 850px) {
  .map-panel,
  .progress-panel,
  .shop-panel {
    padding: 18px;
  }
}
/* ========================================
   レトロゲーム風の達成度パネル
   ======================================== */

/* 達成度パネルの背景 */
.progress-panel {
  background: #172344;
  color: #fff5d6;
  text-align: center;
}

/* 達成度のタイトル */
.progress-panel h2 {
  color: #ffda66;
  font-size: 24px;
  margin: 0 0 12px;
  text-shadow: 3px 3px #080e20;
}

/* 達成率と店舗数 */
.progress-number {
  color: #fff5d6;
  font-size: 32px;
  font-weight: bold;
  margin: 12px 0;
  text-shadow: 3px 3px #080e20;
}

/* 店舗数の文字 */
.progress-count {
  font-size: 20px;
}

/* 12マスの達成度ゲージ */
.progress-bar {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 4px;

  height: 30px;
  padding: 4px;

  background: #080e20;
  border: 3px solid #dfac42;
  border-radius: 0;
}

/* まだ達成していないマス */
.progress-cell {
  background: #39425c;
  min-width: 0;
}

/* 達成したマス */
.progress-cell.filled {
  background: #63c856;
  box-shadow: inset 0 4px 0 #a3ed79;
}
/* ========================================
   レトロゲーム風のラーメン店舗一覧
   ======================================== */

/* 店舗一覧の背景 */
.shop-panel {
  background: #172344;
  color: #fff5d6;
}

/* 店舗一覧のタイトル */
.shop-panel h2 {
  color: #ffda66;
  text-align: center;
  font-size: 22px;
  margin: 0 0 16px;
  text-shadow: 3px 3px #080e20;
}

/* 店舗一覧のスクロール設定 */
.shop-list {
  max-height: 350px;
  overflow-y: auto;
  padding: 4px;
  scrollbar-color: #d9ad45 #10172e;
}

/* 店舗ごとのデザイン */
.shop-item {
  display: flex;
  align-items: center;
  gap: 10px;

  background: #fff5d6;
  color: #172344;

  border: 2px solid #b78b42;
  border-radius: 0;

  padding: 12px 10px;
  margin-bottom: 8px;

  font-size: 16px;
  font-weight: bold;

  box-shadow: inset 0 -3px 0 #e5d3a4;
}

/* 未達成のチェックボックス */
.shop-item::before {
  content: "";
  display: inline-block;
  width: 18px;
  height: 18px;
  flex-shrink: 0;

  background: #fffdf0;
  border: 2px solid #9a793c;
}

/* 未達成の文字 */
.shop-item::after {
  content: "未達成";
  margin-left: auto;
  color: #8b7855;
  font-size: 11px;
  white-space: nowrap;
}

/* 達成済み店舗の背景 */
.shop-item.completed {
  background: #d9edb9;
  border-color: #579b42;
  box-shadow: inset 0 -3px 0 #b1d68c;
}

/* 達成済みのチェックボックス */
.shop-item.completed::before {
  content: "✓";
  background: #4a9849;
  border-color: #327539;
  color: white;
  text-align: center;
  line-height: 18px;
}

/* 達成済みの文字 */
.shop-item.completed::after {
  content: "GET!";
  color: #327539;
  font-size: 13px;
  font-weight: bold;
}
/* ========================================
   QR読み込みボタンの画像デザイン
   ======================================== */

/* 元のボタンの背景や枠をなくす */
.qr-button {
  width: 100%;
  padding: 0;

  background: transparent;

}

/* ボタン画像の大きさ */
.qr-button img {

}

/* 読み込み準備中の表示 */
.qr-button:disabled {

}

/* ボタンの配置 */

/* ボタン画像 */

}

@media (max-width: 850px) {

  }

}

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    /* ===== ラーメン12店舗の設定 ===== */

    // 後から店舗を追加・変更しやすいように配列で管理
    const ramenShops = [
  "風靡",
  "はかたや",
  "元祖長浜",
  "ふくちゃんらーめん",
  "いってつ",
  "しんしん",
  "大砲ラーメン",
  "ラーメン膳",
  "一双",
  "メンドロイド",
  "丸源ラーメン",
  "てんてんラーメン"
];

    /* ===== 店舗一覧を画面に表示 ===== */

    const shopList = document.getElementById("shop-list");

    ramenShops.forEach((shopName) => {

      // 店舗を表示する行を作成
      const item = document.createElement("li");

      // デザイン用のクラスを設定
      item.className = "shop-item";

      // 店舗名を表示
      item.textContent = shopName;
      item.dataset.shop = shopName;

      // 一覧に追加
      shopList.appendChild(item);

    });

    /* ===== 達成度を更新する機能 ===== */

    // 今はまだ訪問済み店舗がないので0
    const completedShops = new Set();
    const visitKey = "fukuoka-ramen-qr-visits-12-v1";
    let zones = {};
    function saveVisits() {
      try { localStorage.setItem(visitKey, JSON.stringify([...completedShops])); }
      catch (error) { console.warn("訪問記録を保存できませんでした", error); }
    }
    // 訪問済み店舗の担当マスを緑色にする
    function paintVisits() {
      const painted = new Set([...completedShops].flatMap(name => zones[name] || []));
      pixelMap.querySelectorAll(".land").forEach(cell => {
        cell.classList.toggle("visited", painted.has(`${cell.dataset.x},${cell.dataset.y}`));
      });
      document.querySelectorAll(".shop-item").forEach(item => {
        item.classList.toggle("completed", completedShops.has(item.dataset.shop));
      });
      updateProgress();
    }
    // JSONを読み込み、地図と一致する座標だけを使用
    async function loadZones() {
      try {
        const response = await fetch("ramen-zones.json", {cache:"no-store"});
        if (!response.ok) throw new Error("JSON取得失敗");
        const data = await response.json();
        if (data.columns !== MAP_COLUMNS || !data.zones) throw new Error("地図の設定が異なります");
        const land = new Set([...pixelMap.querySelectorAll(".land")].map(c => `${c.dataset.x},${c.dataset.y}`));
        for (const name of ramenShops) {
          zones[name] = Array.isArray(data.zones[name]) ? [...new Set(data.zones[name].filter(key => land.has(key)))] : [];
        }
        try {
          const saved = JSON.parse(localStorage.getItem(visitKey) || "[]");
          if (Array.isArray(saved)) saved.filter(name => ramenShops.includes(name) && zones[name].length).forEach(name => completedShops.add(name));
        } catch (error) { console.warn(error); }
        paintVisits();
        document.getElementById("qr-start").disabled = false;
        if (ramenShops.some(name => !zones[name].length)) mapStatus.textContent = "一部の店舗の座標が地図と一致しません。";
      } catch (error) {
        mapStatus.textContent = "範囲データを読み込めません。ramen-zones.jsonを確認してください。";
        console.error(error);
      }
    }

    function updateProgress() {

  // 達成した店舗数と全店舗数
  const completed = completedShops.size;
  const total = ramenShops.length;

  // 達成率を計算
  const percentage = Math.round(
    (completed / total) * 100
  );

  // 達成した店舗数を表示
  document.getElementById("completed-count")
    .textContent = completed;

  // 達成率を表示
  document.getElementById("progress-percent")
    .textContent = percentage + "%";

  // 達成度ゲージを取得
  const progressBar =
    document.getElementById("progress-bar");

  // 古いゲージを消す
  progressBar.replaceChildren();

  // 12店舗分のマスを作る
  for (let i = 0; i < total; i++) {

    const cell = document.createElement("div");
    cell.className = "progress-cell";

    // 達成済みのマスを緑色にする
    if (i < completed) {
      cell.classList.add("filled");
    }

    progressBar.appendChild(cell);
  }
}

    // 最初の達成度を表示
    updateProgress();

/* ===== 福岡市のドット地図を作成 ===== */

// 福岡市のGeoJSONデータ
const GEOJSON_URL = "https://wapi.bodik.jp/estat/polygon?organ_code=401307";
const MAP_COLUMNS = 200;
const pixelMap = document.getElementById("pixel-map");
const mapStatus = document.getElementById("map-status");

// 点が閉じた輪郭の内側にあるか調べる
function pointInRing(point, ring) {
  const [x, y] = point;
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i];
    const [xj, yj] = ring[j];
    if ((yi > y) !== (yj > y) &&
        x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) {
      inside = !inside;
    }
  }
  return inside;
}

// 外周と穴の両方を考慮する
function pointInPolygon(point, polygon) {
  if (!polygon.length || !pointInRing(point, polygon[0])) return false;
  return !polygon.slice(1).some(hole => pointInRing(point, hole));
}

// Polygon・MultiPolygon・FeatureCollectionに対応する
function collectPolygons(data) {
  const polygons = [];
  function addGeometry(geometry) {
    if (!geometry) return;
    if (geometry.type === "Polygon") polygons.push(geometry.coordinates);
    else if (geometry.type === "MultiPolygon") polygons.push(...geometry.coordinates);
    else if (geometry.type === "GeometryCollection") {
      geometry.geometries.forEach(addGeometry);
    }
  }
  function walk(item) {
    if (!item) return;
    if (item.type === "FeatureCollection") item.features.forEach(walk);
    else if (item.type === "Feature") addGeometry(item.geometry);
    else addGeometry(item);
  }
  walk(data);
  return polygons;
}

// 上の左側に離れている「数マスだけ」の小さな集まりを除外する
// ほかの陸地は残す（最大の陸地だけに限定しない）
function removeTinyUpperLeftIslands(cells, rows, cols) {
  const visited = new Uint8Array(cells.length);
  const directions = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const groups = [];

  for (let start = 0; start < cells.length; start++) {
    if (!cells[start] || visited[start]) continue;
    const queue = [start];
    const group = [];
    visited[start] = 1;
    let minRow = rows;
    let maxRow = 0;
    let minCol = cols;
    let maxCol = 0;

    for (let head = 0; head < queue.length; head++) {
      const index = queue[head];
      group.push(index);
      const row = Math.floor(index / cols);
      const col = index % cols;
      minRow = Math.min(minRow, row);
      maxRow = Math.max(maxRow, row);
      minCol = Math.min(minCol, col);
      maxCol = Math.max(maxCol, col);
      for (const [dr, dc] of directions) {
        const nr = row + dr;
        const nc = col + dc;
        if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
        const next = nr * cols + nc;
        if (cells[next] && !visited[next]) {
          visited[next] = 1;
          queue.push(next);
        }
      }
    }
    groups.push({ group, minRow, maxRow, minCol, maxCol });
  }

  // 本体との位置関係から「左上」を判断する
  const main = groups.reduce((a, b) =>
    !a || b.group.length > a.group.length ? b : a, null);
  if (!main) return;

  // 本体より左上にあり、8マス以下の離れた集まりだけ削除
  for (const item of groups) {
    if (item === main) continue;
    if (item.group.length <= 32 &&
        item.maxRow < main.minRow &&
        item.maxCol < main.minCol) {
      item.group.forEach(index => { cells[index] = 0; });
    }
  }
}

async function createFukuokaMap() {
  try {
    const response = await fetch(GEOJSON_URL);
    if (!response.ok) throw new Error("地図データの取得に失敗しました");
    const geojson = await response.json();
    const polygons = collectPolygons(geojson);
    if (!polygons.length) throw new Error("輪郭データが見つかりません");

    // すべての陸地の座標を使う。最大の1つに絞らない
    const points = polygons.flatMap(polygon => polygon.flatMap(ring => ring));
    const xs = points.map(point => point[0]);
    const ys = points.map(point => point[1]);
    const minX = Math.min(...xs);
    const maxX = Math.max(...xs);
    const minY = Math.min(...ys);
    const maxY = Math.max(...ys);

    // 経度を緯度に合わせて補正し、地図の形が伸びないようにする
    const latitude = (minY + maxY) / 2;
    const scaleX = Math.cos(latitude * Math.PI / 180);
    const mapWidth = (maxX - minX) * scaleX;
    const mapHeight = maxY - minY;
    const MAP_ROWS = Math.max(1, Math.round(MAP_COLUMNS * mapHeight / mapWidth));

    // 各マスの中心が福岡市の中にあるか判定
    const cells = new Uint8Array(MAP_COLUMNS * MAP_ROWS);
    for (let row = 0; row < MAP_ROWS; row++) {
      for (let col = 0; col < MAP_COLUMNS; col++) {
        const longitude = minX + (col + 0.5) / MAP_COLUMNS * (maxX - minX);
        const latitude = maxY - (row + 0.5) / MAP_ROWS * (maxY - minY);
        if (polygons.some(polygon => pointInPolygon([longitude, latitude], polygon))) {
          cells[row * MAP_COLUMNS + col] = 1;
        }
      }
    }

    // 左上の離れた数マスだけを除外
    removeTinyUpperLeftIslands(cells, MAP_ROWS, MAP_COLUMNS);

    // 残った陸地を囲む範囲を求め、余分な余白を取り除く
    let top = MAP_ROWS, bottom = -1, left = MAP_COLUMNS, right = -1;
    for (let row = 0; row < MAP_ROWS; row++) {
      for (let col = 0; col < MAP_COLUMNS; col++) {
        if (!cells[row * MAP_COLUMNS + col]) continue;
        top = Math.min(top, row);
        bottom = Math.max(bottom, row);
        left = Math.min(left, col);
        right = Math.max(right, col);
      }
    }
    if (bottom < top) throw new Error("地図のマスが作れませんでした");

    const visibleCols = right - left + 1;
    const visibleRows = bottom - top + 1;
    pixelMap.style.gridTemplateColumns = `repeat(${visibleCols}, minmax(0, 1fr))`;
    pixelMap.style.gridTemplateRows = `repeat(${visibleRows}, minmax(0, 1fr))`;
    pixelMap.style.aspectRatio = `${visibleCols} / ${visibleRows}`;

    // 地図本体を中央に配置する
    const fragment = document.createDocumentFragment();
    for (let row = top; row <= bottom; row++) {
      for (let col = left; col <= right; col++) {
        const cell = document.createElement("div");
        cell.className = cells[row * MAP_COLUMNS + col] ? "map-cell land" : "map-cell";
        cell.dataset.x = col;
        cell.dataset.y = row;
        fragment.appendChild(cell);
      }
    }
    pixelMap.replaceChildren(fragment);
    mapStatus.textContent = "";
    await loadZones();
  } catch (error) {
    console.error(error);
    mapStatus.textContent = "地図を表示できませんでした。地図データの取得先を確認してください。";
  }
}

// ページを開いたら地図を作る
// QRコードの内容と店舗の対応（一覧の順番で01〜12）
const qrShops = new Map(ramenShops.map((name, i) => [`FUKUOKA-RAMEN-${String(i+1).padStart(2,"0")}`, name]));
const qrStart = document.getElementById("qr-start");
const qrStop = document.getElementById("qr-stop");
const qrPanel = document.getElementById("qr-panel");
const qrMessage = document.getElementById("qr-message");
let scanner = null;
let busy = false;
let reading = false;

// カメラを停止して画面を閉じる
async function closeCamera() {
  if (busy) return;
  busy = true;
  try {
    if (scanner?.isScanning) await scanner.stop();
    if (scanner) scanner.clear();
    scanner = null;
    qrPanel.hidden = true;
    qrStart.disabled = false;
  } catch (error) {
    qrMessage.textContent = "カメラを停止できませんでした。ページを閉じてください。";
  } finally { busy = false; reading = false; }
}

// 正しい店舗QRだけを受け付ける
async function onQrSuccess(decodedText) {
  if (busy || reading) return;
  const name = qrShops.get(decodedText.trim());
  if (!name || !zones[name]?.length) {
    qrMessage.textContent = "このゲームの有効な店舗QRではありません。";
    return;
  }
  reading = true;
  if (completedShops.has(name)) {
    qrMessage.textContent = `${name} は達成済みです。`;
  } else {
    completedShops.add(name);
    saveVisits();
    paintVisits();
    qrMessage.textContent = `${name} GET！`;
  }
  await closeCamera();
}

// 利用者の操作でカメラを起動（スマホでは背面カメラを優先）
qrStart.addEventListener("click", async () => {
  if (busy || scanner) return;
  busy = true;
  qrStart.disabled = true;
  qrStop.disabled = true;
  qrPanel.hidden = false;
  qrMessage.textContent = "カメラを起動しています…";
  try {
    if (typeof Html5Qrcode === "undefined") throw new Error("QRライブラリ未読込");
    scanner = new Html5Qrcode("qr-reader");
    await scanner.start({facingMode:"environment"}, {fps:10}, onQrSuccess, () => {});
    qrMessage.textContent = "店舗専用QRコードをカメラに映してください。";
  } catch (error) {
    try { if (scanner?.isScanning) await scanner.stop(); if (scanner) scanner.clear(); } catch (_) {}
    scanner = null;
    qrPanel.hidden = true;
    qrStart.disabled = false;
    qrMessage.textContent = "カメラを起動できません。HTTPSとカメラの許可を確認してください。";
    console.error(error);
  } finally { busy = false; qrStop.disabled = false; }
});
qrStop.addEventListener("click", closeCamera);
window.addEventListener("pagehide", () => { if (scanner?.isScanning) scanner.stop().catch(() => {}); });
createFukuokaMap();

  </script>
