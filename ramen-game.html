    /* ===== 色や背景の設定 ===== */
    :root {
      --main-color: #3c7651;
      --light-color: #e8f4e8;
      --text-color: #264b39;

      /* 背景画像は後から設定できる */

    }

    /* ===== ページ全体 ===== */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: sans-serif;
      color: var(--text-color);

      background-image: var(--game-background);

  <script>
    /* ===== ラーメン12店舗の設定 ===== */

    // 後から店舗を追加・変更しやすいように配列で管理
    const ramenShops = [
  "風靡",
  "はかたや",
  "元祖長浜",
  "ふくちゃんらーめん",
  "いってつ",
  "しんしん",
  "大砲ラーメン",
  "ラーメン膳",
  "一双",
  "メンドロイド",
  "丸源ラーメン",
  "てんてんラーメン"
];

    /* ===== 店舗一覧を画面に表示 ===== */

    const shopList = document.getElementById("shop-list");

    ramenShops.forEach((shopName) => {

      // 店舗を表示する行を作成
      const item = document.createElement("li");

      // デザイン用のクラスを設定
      item.className = "shop-item";

      // 店舗名を表示
      item.textContent = shopName;
      item.dataset.shop = shopName;

      // 一覧に追加
      shopList.appendChild(item);

    });

    /* ===== 達成度を更新する機能 ===== */

    // 今はまだ訪問済み店舗がないので0
    const completedShops = new Set();
    const visitKey = "fukuoka-ramen-qr-visits-12-v1";
    let zones = {};
    function saveVisits() {
      try { localStorage.setItem(visitKey, JSON.stringify([...completedShops])); }
      catch (error) { console.warn("訪問記録を保存できませんでした", error); }
    }
    // 訪問済み店舗の担当マスを緑色にする
    function paintVisits() {
      const painted = new Set([...completedShops].flatMap(name => zones[name] || []));
      pixelMap.querySelectorAll(".land").forEach(cell => {
        cell.classList.toggle("visited", painted.has(`${cell.dataset.x},${cell.dataset.y}`));
      });
      document.querySelectorAll(".shop-item").forEach(item => {
        item.classList.toggle("completed", completedShops.has(item.dataset.shop));
      });
      updateProgress();
    }
    // JSONを読み込み、地図と一致する座標だけを使用
    async function loadZones() {
      try {
        const response = await fetch("ramen-zones.json", {cache:"no-store"});
        if (!response.ok) throw new Error("JSON取得失敗");
        const data = await response.json();
        if (data.columns !== MAP_COLUMNS || !data.zones) throw new Error("地図の設定が異なります");
        const land = new Set([...pixelMap.querySelectorAll(".land")].map(c => `${c.dataset.x},${c.dataset.y}`));
        for (const name of ramenShops) {
          zones[name] = Array.isArray(data.zones[name]) ? [...new Set(data.zones[name].filter(key => land.has(key)))] : [];
        }
        try {
          const saved = JSON.parse(localStorage.getItem(visitKey) || "[]");
          if (Array.isArray(saved)) saved.filter(name => ramenShops.includes(name) && zones[name].length).forEach(name => completedShops.add(name));
        } catch (error) { console.warn(error); }
        paintVisits();
        document.getElementById("qr-start").disabled = false;
        if (ramenShops.some(name => !zones[name].length)) mapStatus.textContent = "一部の店舗の座標が地図と一致しません。";
      } catch (error) {
        mapStatus.textContent = "範囲データを読み込めません。ramen-zones.jsonを確認してください。";
        console.error(error);
      }
    }

    function updateProgress() {

      const completed = completedShops.size;
      const total = ramenShops.length;

      // 達成した店舗数を表示
      document.getElementById("completed-count")
        .textContent = completed;

      // 達成度バーを更新
      const percentage = (completed / total) * 100;

      document.getElementById("progress-fill")
        .style.width = percentage + "%";
    }

    // 最初の達成度を表示
    updateProgress();

/* ===== 福岡市のドット地図を作成 ===== */

// 福岡市のGeoJSONデータ
const GEOJSON_URL = "https://wapi.bodik.jp/estat/polygon?organ_code=401307";
const MAP_COLUMNS = 200;
const pixelMap = document.getElementById("pixel-map");
const mapStatus = document.getElementById("map-status");

// 点が閉じた輪郭の内側にあるか調べる
function pointInRing(point, ring) {
  const [x, y] = point;
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i];
    const [xj, yj] = ring[j];
    if ((yi > y) !== (yj > y) &&
        x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) {
      inside = !inside;
    }
  }
  return inside;
}

// 外周と穴の両方を考慮する
function pointInPolygon(point, polygon) {
  if (!polygon.length || !pointInRing(point, polygon[0])) return false;
  return !polygon.slice(1).some(hole => pointInRing(point, hole));
}

// Polygon・MultiPolygon・FeatureCollectionに対応する
function collectPolygons(data) {
  const polygons = [];
  function addGeometry(geometry) {
    if (!geometry) return;
    if (geometry.type === "Polygon") polygons.push(geometry.coordinates);
    else if (geometry.type === "MultiPolygon") polygons.push(...geometry.coordinates);
    else if (geometry.type === "GeometryCollection") {
      geometry.geometries.forEach(addGeometry);
    }
  }
  function walk(item) {
    if (!item) return;
    if (item.type === "FeatureCollection") item.features.forEach(walk);
    else if (item.type === "Feature") addGeometry(item.geometry);
    else addGeometry(item);
  }
  walk(data);
  return polygons;
}

// 上の左側に離れている「数マスだけ」の小さな集まりを除外する
// ほかの陸地は残す（最大の陸地だけに限定しない）
function removeTinyUpperLeftIslands(cells, rows, cols) {
  const visited = new Uint8Array(cells.length);
  const directions = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const groups = [];

  for (let start = 0; start < cells.length; start++) {
    if (!cells[start] || visited[start]) continue;
    const queue = [start];
    const group = [];
    visited[start] = 1;
    let minRow = rows;
    let maxRow = 0;
    let minCol = cols;
    let maxCol = 0;

    for (let head = 0; head < queue.length; head++) {
      const index = queue[head];
      group.push(index);
      const row = Math.floor(index / cols);
      const col = index % cols;
      minRow = Math.min(minRow, row);
      maxRow = Math.max(maxRow, row);
      minCol = Math.min(minCol, col);
      maxCol = Math.max(maxCol, col);
      for (const [dr, dc] of directions) {
        const nr = row + dr;
        const nc = col + dc;
        if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
        const next = nr * cols + nc;
        if (cells[next] && !visited[next]) {
          visited[next] = 1;
          queue.push(next);
        }
      }
    }
    groups.push({ group, minRow, maxRow, minCol, maxCol });
  }

  // 本体との位置関係から「左上」を判断する
  const main = groups.reduce((a, b) =>
    !a || b.group.length > a.group.length ? b : a, null);
  if (!main) return;

  // 本体より左上にあり、8マス以下の離れた集まりだけ削除
  for (const item of groups) {
    if (item === main) continue;
    if (item.group.length <= 32 &&
        item.maxRow < main.minRow &&
        item.maxCol < main.minCol) {
      item.group.forEach(index => { cells[index] = 0; });
    }
  }
}

async function createFukuokaMap() {
  try {
    const response = await fetch(GEOJSON_URL);
    if (!response.ok) throw new Error("地図データの取得に失敗しました");
    const geojson = await response.json();
    const polygons = collectPolygons(geojson);
    if (!polygons.length) throw new Error("輪郭データが見つかりません");

    // すべての陸地の座標を使う。最大の1つに絞らない
    const points = polygons.flatMap(polygon => polygon.flatMap(ring => ring));
    const xs = points.map(point => point[0]);
    const ys = points.map(point => point[1]);
    const minX = Math.min(...xs);
    const maxX = Math.max(...xs);
    const minY = Math.min(...ys);
    const maxY = Math.max(...ys);

    // 経度を緯度に合わせて補正し、地図の形が伸びないようにする
    const latitude = (minY + maxY) / 2;
    const scaleX = Math.cos(latitude * Math.PI / 180);
    const mapWidth = (maxX - minX) * scaleX;
    const mapHeight = maxY - minY;
    const MAP_ROWS = Math.max(1, Math.round(MAP_COLUMNS * mapHeight / mapWidth));

    // 各マスの中心が福岡市の中にあるか判定
    const cells = new Uint8Array(MAP_COLUMNS * MAP_ROWS);
    for (let row = 0; row < MAP_ROWS; row++) {
      for (let col = 0; col < MAP_COLUMNS; col++) {
        const longitude = minX + (col + 0.5) / MAP_COLUMNS * (maxX - minX);
        const latitude = maxY - (row + 0.5) / MAP_ROWS * (maxY - minY);
        if (polygons.some(polygon => pointInPolygon([longitude, latitude], polygon))) {
          cells[row * MAP_COLUMNS + col] = 1;
        }
      }
    }

    // 左上の離れた数マスだけを除外
    removeTinyUpperLeftIslands(cells, MAP_ROWS, MAP_COLUMNS);

    // 残った陸地を囲む範囲を求め、余分な余白を取り除く
    let top = MAP_ROWS, bottom = -1, left = MAP_COLUMNS, right = -1;
    for (let row = 0; row < MAP_ROWS; row++) {
      for (let col = 0; col < MAP_COLUMNS; col++) {
        if (!cells[row * MAP_COLUMNS + col]) continue;
        top = Math.min(top, row);
        bottom = Math.max(bottom, row);
        left = Math.min(left, col);
        right = Math.max(right, col);
      }
    }
    if (bottom < top) throw new Error("地図のマスが作れませんでした");

    const visibleCols = right - left + 1;
    const visibleRows = bottom - top + 1;
    pixelMap.style.gridTemplateColumns = `repeat(${visibleCols}, minmax(0, 1fr))`;
    pixelMap.style.gridTemplateRows = `repeat(${visibleRows}, minmax(0, 1fr))`;
    pixelMap.style.aspectRatio = `${visibleCols} / ${visibleRows}`;

    // 地図本体を中央に配置する
    const fragment = document.createDocumentFragment();
    for (let row = top; row <= bottom; row++) {
      for (let col = left; col <= right; col++) {
        const cell = document.createElement("div");
        cell.className = cells[row * MAP_COLUMNS + col] ? "map-cell land" : "map-cell";
        cell.dataset.x = col;
        cell.dataset.y = row;
        fragment.appendChild(cell);
      }
    }
    pixelMap.replaceChildren(fragment);
    mapStatus.textContent = "";
    await loadZones();
  } catch (error) {
    console.error(error);
    mapStatus.textContent = "地図を表示できませんでした。地図データの取得先を確認してください。";
  }
}

// ページを開いたら地図を作る
// QRコードの内容と店舗の対応（一覧の順番で01〜12）
const qrShops = new Map(ramenShops.map((name, i) => [`FUKUOKA-RAMEN-${String(i+1).padStart(2,"0")}`, name]));
const qrStart = document.getElementById("qr-start");
const qrStop = document.getElementById("qr-stop");
const qrPanel = document.getElementById("qr-panel");
const qrMessage = document.getElementById("qr-message");
let scanner = null;
let busy = false;
let reading = false;

// カメラを停止して画面を閉じる
async function closeCamera() {
  if (busy) return;
  busy = true;
  try {
    if (scanner?.isScanning) await scanner.stop();
    if (scanner) scanner.clear();
    scanner = null;
    qrPanel.hidden = true;
    qrStart.disabled = false;
  } catch (error) {
    qrMessage.textContent = "カメラを停止できませんでした。ページを閉じてください。";
  } finally { busy = false; reading = false; }
}

// 正しい店舗QRだけを受け付ける
async function onQrSuccess(decodedText) {
  if (busy || reading) return;
  const name = qrShops.get(decodedText.trim());
  if (!name || !zones[name]?.length) {
    qrMessage.textContent = "このゲームの有効な店舗QRではありません。";
    return;
  }
  reading = true;
  if (completedShops.has(name)) {
    qrMessage.textContent = `${name} は達成済みです。`;
  } else {
    completedShops.add(name);
    saveVisits();
    paintVisits();
    qrMessage.textContent = `${name} GET！`;
  }
  await closeCamera();
}

// 利用者の操作でカメラを起動（スマホでは背面カメラを優先）
qrStart.addEventListener("click", async () => {
  if (busy || scanner) return;
  busy = true;
  qrStart.disabled = true;
  qrStop.disabled = true;
  qrPanel.hidden = false;
  qrMessage.textContent = "カメラを起動しています…";
  try {
    if (typeof Html5Qrcode === "undefined") throw new Error("QRライブラリ未読込");
    scanner = new Html5Qrcode("qr-reader");
    await scanner.start({facingMode:"environment"}, {fps:10}, onQrSuccess, () => {});
    qrMessage.textContent = "店舗専用QRコードをカメラに映してください。";
  } catch (error) {
    try { if (scanner?.isScanning) await scanner.stop(); if (scanner) scanner.clear(); } catch (_) {}
    scanner = null;
    qrPanel.hidden = true;
    qrStart.disabled = false;
    qrMessage.textContent = "カメラを起動できません。HTTPSとカメラの許可を確認してください。";
    console.error(error);
  } finally { busy = false; qrStop.disabled = false; }
});
qrStop.addEventListener("click", closeCamera);
window.addEventListener("pagehide", () => { if (scanner?.isScanning) scanner.stop().catch(() => {}); });
createFukuokaMap();

  </script>

</body>
