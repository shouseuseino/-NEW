
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <!-- スマホでも画面幅に合わせて表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>福岡市ラーメン | 福岡コレクション</title>

  <style>
    /* ===== 色や背景の設定 ===== */
    :root {
      --main-color: #3c7651;
      --light-color: #e8f4e8;
      --text-color: #264b39;

      /* 背景画像は後から設定できる */
      --game-background: none;
    }

    /* ===== ページ全体 ===== */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: sans-serif;
      color: var(--text-color);

      background-color: #d9edda;
      background-image: var(--game-background);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* ===== 上部のロゴ ===== */
    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 20px;
      max-width: 1300px;
      margin: auto;
    }

    .game-logo {
      width: min(260px, 55%);
      height: auto;
    }

    .stage-title {
      padding: 12px 20px;
      background: white;
      border: 3px solid var(--main-color);
      border-radius: 15px;
      font-weight: bold;
    }

    /* ===== 地図と店舗一覧の配置 ===== */
    .main-area {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 20px;
      max-width: 1300px;
      margin: 10px auto;
      padding: 0 20px;
      align-items: start;
    }

    /* ===== 地図エリア ===== */
    .map-panel {
      background: white;
      border: 4px solid var(--main-color);
      border-radius: 22px;
      padding: 20px;
      min-height: 570px;
    }

    .map-panel h2 {
      text-align: center;
      margin-top: 0;
    }

    /* 後から福岡市のドット地図をここに表示する */
    .map-area {
      width: 100%;
      min-height: 450px;
      background: #f5faf5;
      border: 2px dashed #9cbea5;
      border-radius: 15px;

      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .map-message {
      color: #789681;
      line-height: 1.8;
    }

    /* ===== 右側の情報エリア ===== */
    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .progress-panel,
    .shop-panel {
      background: white;
      border: 4px solid var(--main-color);
      border-radius: 22px;
      padding: 20px;
    }

    /* ===== 達成度 ===== */
    .progress-panel h2 {
      margin-top: 0;
    }

    .progress-number {
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      margin: 15px 0;
    }

    .progress-bar {
      width: 100%;
      height: 22px;
      background: #d9e5da;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #64bb70;
      transition: width 0.3s;
    }

    /* ===== ラーメン店舗一覧 ===== */
    .shop-panel h2 {
      margin-top: 0;
    }

    .shop-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 350px;
      overflow-y: auto;
    }

    .shop-item {
      padding: 12px;
      margin-bottom: 8px;
      background: var(--light-color);
      border-radius: 10px;
      font-weight: bold;
    }

    .shop-item::before {
      content: "□ ";
      color: var(--main-color);
    }

    /* 訪問済み店舗に適用するデザイン */
    .shop-item.completed {
      background: #c0e9c3;
    }

    .shop-item.completed::before {
      content: "✓ ";
    }

    /* ===== QR読み取りボタン ===== */
    .qr-button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 14px;
      background: var(--main-color);
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    /* 機能を作るまでは押せない状態にする */
    .qr-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ===== 戻るボタン ===== */
    .back-area {
      max-width: 1300px;
      margin: 20px auto 40px;
      padding: 0 20px;
    }

    .back-button {
      display: inline-block;
      padding: 14px 24px;
      background: white;
      border: 3px solid var(--main-color);
      border-radius: 15px;
      color: var(--text-color);
      text-decoration: none;
      font-weight: bold;
    }

    /* ===== スマホ対応 ===== */
    @media (max-width: 850px) {
      .game-header {
        padding: 15px;
      }

      .stage-title {
        padding: 10px;
        font-size: 13px;
      }

      .main-area {
        grid-template-columns: 1fr;
        padding: 0 12px;
      }

      .map-panel {
        min-height: auto;
        padding: 12px;
      }

      .map-area {
        min-height: 350px;
      }

      .progress-panel,
      .shop-panel {
        padding: 15px;
      }
    }
    /* ===== 福岡市ドット地図 ===== */

/* 地図を表示するエリア */
.map-area {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 450px;
}

/* ドット地図全体 */
#pixel-map {
  display: grid;
  width: 100%;
  max-width: 600px;
  aspect-ratio: 1;
  gap: 0;
}

/* 地図を構成する1マス */
.map-cell {
  background: transparent;
  min-width: 0;
  min-height: 0;
}

/* 福岡市の内側だけ白色にする */
.map-cell.land {
  background: white;
}

/* 地図の読み込み状態 */
#map-status {
  color: #789681;
  text-align: center;
}

/* スマホ対応 */
@media (max-width: 850px) {
  #pixel-map {
    max-width: 100%;
  }
}

<body>

  <!-- ===== ゲーム画面上部 ===== -->
  <header class="game-header">

    <!-- 以前の福岡コレクションのロゴを使用 -->
    <img
      src="images/logonew.png"
      alt="福岡コレクション"
      class="game-logo"
    >

    <div class="stage-title">
      🍜 福岡市ラーメン
    </div>

  </header>

  <!-- ===== メイン画面 ===== -->
  <main class="main-area">

    <!-- 左側：福岡市の地図 -->
    <section class="map-panel">

      <h2>福岡市ラーメンマップ</h2>

      <div class="map-area" id="map-area">

        <!-- 福岡市のドット地図を表示する場所 -->
<div class="map-area" id="map-area">
  <div id="pixel-map"></div>
  <p id="map-status">福岡市の地図を読み込み中...</p>
</div>

      </div>

    </section>

    <!-- 右側：達成度と店舗一覧 -->
    <aside class="right-panel">

      <!-- 達成度 -->
      <section class="progress-panel">

        <h2>🏆 達成度</h2>

        <div class="progress-number">
          <span id="completed-count">0</span> / 15
        </div>

        <div class="progress-bar">
          <div
            class="progress-fill"
            id="progress-fill"
          ></div>
        </div>

      </section>

      <!-- ラーメン店舗一覧 -->
      <section class="shop-panel">

        <h2>🍜 ラーメン店舗一覧</h2>

        <ul class="shop-list" id="shop-list">
          <!-- JavaScriptで15店舗を表示 -->
        </ul>

      </section>

      <!-- QRコード読み取り -->
      <button class="qr-button" disabled>
        📷 QRコードを読み取る（準備中）
      </button>

    </aside>

  </main>

  <!-- ===== エリア選択画面に戻る ===== -->

    <a href="ramen-area.html" class="back-button">

  <script>
    /* ===== ラーメン15店舗の設定 ===== */

    // 後から店舗を追加・変更しやすいように配列で管理
    const ramenShops = [
      "風靡",
      "はかたや",
      "元祖長浜",
      "ふくちゃんらーめん",
      "いってつ",
      "しんしん",
      "大砲ラーメン",
      "ラーメン膳",
      "一双",
      "楽勝",
      "メンドロイド",
      "丸源ラーメン",
      "大森や",
      "てんてんラーメン",
      "らーめんまさちゃん"
    ];

    /* ===== 店舗一覧を画面に表示 ===== */

    const shopList = document.getElementById("shop-list");

    ramenShops.forEach((shopName) => {

      // 店舗を表示する行を作成
      const item = document.createElement("li");

      // デザイン用のクラスを設定
      item.className = "shop-item";

      // 店舗名を表示
      item.textContent = shopName;

      // 一覧に追加
      shopList.appendChild(item);

    });

    /* ===== 達成度を更新する機能 ===== */

    // 今はまだ訪問済み店舗がないので0
    const completedShops = new Set();

    function updateProgress() {

      const completed = completedShops.size;
      const total = ramenShops.length;

      // 達成した店舗数を表示
      document.getElementById("completed-count")
        .textContent = completed;

      // 達成度バーを更新
      const percentage = (completed / total) * 100;

      document.getElementById("progress-fill")
        .style.width = percentage + "%";
    }

    // 最初の達成度を表示
    updateProgress();

/* ===== 福岡市のドット地図を作成 ===== */

// 前に使用した福岡市のGeoJSON取得先
const GEOJSON_URL =
  "https://wapi.bodik.jp/estat/polygon?organ_code=401307";

// 地図の横方向のマス数
const MAP_COLUMNS = 100;

// 地図の表示場所
const pixelMap = document.getElementById("pixel-map");
const mapStatus = document.getElementById("map-status");

// 点がポリゴンの内側にあるかを調べる
function pointInRing(point, ring) {
  const [x, y] = point;
  let inside = false;

  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0];
    const yi = ring[i][1];
    const xj = ring[j][0];
    const yj = ring[j][1];

    const crosses =
      (yi > y) !== (yj > y) &&
      x < ((xj - xi) * (y - yi)) / (yj - yi) + xi;

    if (crosses) {
      inside = !inside;
    }
  }

  return inside;
}

// 穴のあるポリゴンにも対応する
function pointInPolygon(point, polygon) {
  if (!polygon.length) return false;

  // 外側の輪郭に入っていなければ対象外
  if (!pointInRing(point, polygon[0])) {
    return false;
  }

  // 内側の穴に入っている場合は対象外
  for (let i = 1; i < polygon.length; i++) {
    if (pointInRing(point, polygon[i])) {
      return false;
    }
  }

  return true;
}

// GeoJSONのPolygonとMultiPolygonを統一して扱う
function collectPolygons(data) {
  const polygons = [];

  function addGeometry(geometry) {
    if (!geometry) return;

    if (geometry.type === "Polygon") {
      polygons.push(geometry.coordinates);
    }

    if (geometry.type === "MultiPolygon") {
      polygons.push(...geometry.coordinates);
    }

    if (geometry.type === "GeometryCollection") {
      geometry.geometries.forEach(addGeometry);
    }
  }

  function walk(item) {
    if (!item) return;

    if (item.type === "FeatureCollection") {
      item.features.forEach(walk);
    } else if (item.type === "Feature") {
      addGeometry(item.geometry);
    } else {
      addGeometry(item);
    }
  }

  walk(data);
  return polygons;
}

// 地図を作成する
async function createFukuokaMap() {
  try {
    const response = await fetch(GEOJSON_URL);

    if (!response.ok) {
      throw new Error("地図データを取得できませんでした");
    }

    const geojson = await response.json();
    /* ===== 離れた小さな島を除外する ===== */

// GeoJSONから福岡市の形を取得
const allPolygons = collectPolygons(geojson);

// ポリゴンの外側の輪郭の面積を計算
function getPolygonArea(polygon) {
  const ring = polygon[0];
  let area = 0;

  for (let i = 0; i < ring.length; i++) {
    const j = (i + 1) % ring.length;

    area +=
      ring[i][0] * ring[j][1] -
      ring[j][0] * ring[i][1];
  }

  return Math.abs(area / 2);
}

// 一番大きな陸地だけを表示する
const polygons = allPolygons.length
  ? [allPolygons.reduce((largest, current) =>
      getPolygonArea(current) > getPolygonArea(largest)
        ? current
        : largest
    )]
  : [];

    if (!polygons.length) {
      throw new Error("地図の形を読み取れませんでした");
    }

    // 全ての座標を取得する
    const points = polygons.flatMap(polygon =>
      polygon.flatMap(ring => ring)
    );

    const xs = points.map(point => point[0]);
    const ys = points.map(point => point[1]);

    const minX = Math.min(...xs);
    const maxX = Math.max(...xs);
    const minY = Math.min(...ys);
    const maxY = Math.max(...ys);

    // 地図の縦横比から行数を決める
    const centerLatitude = (minY + maxY) / 2;
    const longitudeScale =
      Math.cos(centerLatitude * Math.PI / 180);

    const mapWidth = (maxX - minX) * longitudeScale;
    const mapHeight = maxY - minY;

    const MAP_ROWS = Math.max(
      1,
      Math.round(MAP_COLUMNS * mapHeight / mapWidth)
    );

    // 地図の縦横比を設定
    pixelMap.style.gridTemplateColumns =
      `repeat(${MAP_COLUMNS}, minmax(0, 1fr))`;

    pixelMap.style.gridTemplateRows =
      `repeat(${MAP_ROWS}, minmax(0, 1fr))`;

    pixelMap.style.aspectRatio =
      `${MAP_COLUMNS} / ${MAP_ROWS}`;

    pixelMap.innerHTML = "";

    const fragment = document.createDocumentFragment();

    // 各マスの中心が福岡市内かを調べる
    for (let row = 0; row < MAP_ROWS; row++) {
      for (let col = 0; col < MAP_COLUMNS; col++) {

        const longitude =
          minX + (col + 0.5) / MAP_COLUMNS * (maxX - minX);

        const latitude =
          maxY - (row + 0.5) / MAP_ROWS * (maxY - minY);

        const inside = polygons.some(polygon =>
          pointInPolygon([longitude, latitude], polygon)
        );

        const cell = document.createElement("div");
        cell.className = inside
          ? "map-cell land"
          : "map-cell";

        // 次の色塗り機能で使う座標
        cell.dataset.x = col;
        cell.dataset.y = row;

        fragment.appendChild(cell);
      }
    }

    pixelMap.appendChild(fragment);
    mapStatus.textContent = "";

  } catch (error) {
    console.error(error);
    mapStatus.textContent =
      "地図を表示できませんでした。データの取得先を確認してください。";
  }
}

// ページを開いたら地図を作成
createFukuokaMap();

  </script>
