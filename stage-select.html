<!DOCTYPE html>
<html lang="ja">

<head>

  <!-- 文字を日本語で正しく表示するための設定 -->
  <meta charset="UTF-8">

  <!-- スマホでも画面サイズに合わせて表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ブラウザのタブに表示される名前 -->
  <title>ステージ選択</title>


  <style>

    /* ==============================
       画面全体の設定
       ============================== */

    body {

      /* 画面の外側にできる余白をなくす */
      margin: 0;

      /* 画面の高さを最低でも画面いっぱいにする */
      min-height: 100vh;


      /* ==============================
         背景画像の設定
         ============================== */

      /* imagesフォルダの背景画像を表示 */
      background-image: url("images/stage-background.png");

      /* 画面いっぱいになるように背景を拡大・縮小 */
      background-size: cover;

      /* 背景画像の中央を画面の中央に合わせる */
      background-position: center;

      /* 背景画像を繰り返さない */
      background-repeat: no-repeat;

      /* スクロールしても背景を固定する */
      background-attachment: fixed;
    }
    /* =========================
   ステージ選択のタイトル画像
========================= */

.stage-title-image {

  /* 画像をブロックとして表示する */
  display: block;

  /* PCでは最大650px
     小さい画面では画面幅の80%にする */
  width: 80%;
  max-width: 650px;

  /* 画像の縦横比をそのまま維持する */
  height: auto;

  /* 左右を自動にして中央に配置
     上40px・下30pxのすき間 */
  margin: 40px auto 30px;
}
/* =========================
   ステージ1「福岡エリア」のボタン
========================= */

/* ========================================
   4つのステージボタンを並べる場所
======================================== */
.stage-grid {

  /* 2列にする */
  display: grid;
  grid-template-columns: repeat(2, 1fr);

  /* ボタン同士のすき間 */
  gap: 12px;

  /* 全体の横幅 */
  width: 82%;
  max-width: 820px;

  /* 中央に配置 */
  margin: 5px auto 0;
}


/* ========================================
   ステージボタン共通
======================================== */
.stage-button {

  /* HTMLの普通のボタンの見た目を消す */
  border: none;
  background: none;
  padding: 0;

  /* 横幅いっぱい使う */
  width: 100%;
}


/* ========================================
   ステージボタンの画像
======================================== */
.stage-button img {

  /* 枠の横幅いっぱいに表示 */
  width: 100%;

  /* 縦横比を維持 */
  height: auto;

  /* 画像下の余計なすき間をなくす */
  display: block;
}


.stage1-link {
  cursor: pointer;
  display: block;
  text-decoration: none;
}


/* ========================================
   ステージ1を押したとき
======================================== */
button.stage-button:active {

  /* 少し下に動かして押した感じを出す */
  transform: translateY(4px);
}


/* ========================================
   まだ遊べないステージ2〜4
======================================== */
.locked {

  /* 押せないことが分かるようにする */
  cursor: default;
}


/* ========================================
   HOMEボタン
======================================== */
.home-button {

  /* 普通のボタンの見た目を消す */
  border: none;
  background: none;
  padding: 0;

  /* ステージボタンより小さくする */
  width: 30%;
  max-width: 300px;

  /* 中央に配置 */
  display: block;
  margin: 28px auto 25px;

  /* 指マーク */
  cursor: pointer;
}


/* ========================================
   HOMEボタンの画像
======================================== */
.home-button img {

  width: 100%;
  height: auto;
  display: block;
}


/* ========================================
   スマホ用の調整
======================================== */
@media (max-width: 600px) {

  .stage-grid {

    /* スマホでも2×2を維持 */
    width: 94%;

    /* ボタン同士の間隔を小さくする */
    gap: 8px;
  }

  .home-button {

    /* スマホではHOMEを少し大きくする */
    width: 48%;
  }
}


/* =========================
   ステージ1のボタン画像
========================= */

.stage1-button img {

  /* ボタンの横幅いっぱいに画像を表示 */
  width: 100%;

  /* 画像の縦横比を崩さない */
  height: auto;

  /* 画像の下に余計なすき間ができるのを防ぐ */
  display: block;
}
/* ========================================
   ステージ1・HOMEボタン
   動きをなめらかにする
======================================== */
button.stage-button,
.home-button {

  /* 拡大・押し込みの動きをなめらかにする */
  transition: transform 0.1s ease;
}


/* ========================================
   マウスを乗せたとき
   ホーム画面と同じ動き
======================================== */
button.stage-button:hover,
.home-button:hover {

  /* 少しだけ大きくする */
  transform: scale(1.03);
}


/* ========================================
   ボタンを押した瞬間
   ホーム画面と同じ動き
======================================== */
button.stage-button:active,
.home-button:active {

  /* 少し下に沈ませて少し小さくする */
  transform: translateY(5px) scale(0.98);
}



  </style>

</head>


<body>
  <!-- =========================
     ステージ選択のタイトル画像
========================= -->

<img
  src="images/stage-title.png"
  alt="STAGE SELECT"
  class="stage-title-image"
>

<!-- ========================================
     ステージボタンをまとめるエリア
======================================== -->
<div class="stage-grid">

 
  <a href="./stage1.html" class="stage-button stage1-link">
  <img
    src="images/stage1-button.png"
    alt="ステージ1 福岡エリア"
  >
</a>


  <!-- =====================
       ステージ2
       まだ遊べないので画像だけ表示
  ====================== -->
  <div class="stage-button locked">
    <img
      src="images/stage2-button.png"
      alt="ステージ2 準備中"
    >
  </div>


  <!-- =====================
       ステージ3
       まだ遊べないので画像だけ表示
  ====================== -->
  <div class="stage-button locked">
    <img
      src="images/stage3-button.png"
      alt="ステージ3 準備中"
    >
  </div>


  <!-- =====================
       ステージ4
       まだ遊べないので画像だけ表示
  ====================== -->
  <div class="stage-button locked">
    <img
      src="images/stage4-button.png"
      alt="ステージ4 準備中"
    >
  </div>

</div>


<!-- ========================================
     ホーム画面に戻るボタン
======================================== -->
<button class="home-button" onclick="goHome()">

  <img
    src="images/home-button.png"
    alt="ホームに戻る"
  >

</button>



  <script>

    /* ==============================
       ボタンを押したときの動き
       ============================== */


   


    /* ホーム画面へ戻る */
    function goHome() {

      window.location.href = "index.html";

    }

  </script>


</body>

</html>
