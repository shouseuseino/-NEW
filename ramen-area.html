
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <!-- スマホ対応 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>エリア選択 | 福岡コレクション</title>

  <style>

    /* 画面全体の基本設定 */
    * {
      box-sizing: border-box;
    }

    /* =================================
       背景画像（今までの背景を維持）
       ================================= */

    body {
      margin: 0;
      min-height: 100vh;
      font-family: sans-serif;

      background-image: url("images/ramen-area-bg.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* =================================
       画面全体の中央配置
       ================================= */

    .container {
      min-height: 100vh;
      padding: 20px 15px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      /* タイトルとボタン一覧の間隔 */
      gap: 20px;
    }

    /* =================================
       AREA SELECT タイトル画像
       ================================= */

    .title-image {
      width: 600px;
      max-width: 85vw;
      height: auto;
      display: block;
    }

    /* =================================
       エリア選択ボタン一覧
       ================================= */

    .area-list {
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      /* ボタン同士の間隔 */
      gap: 8px;
    }

    /* エリア選択ボタンの大きさ */
    .area-button {
      display: block;
      width: 600px;
      max-width: 90vw;
      text-decoration: none;
    }

    /* ボタン画像の表示設定 */
    .area-button img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 選択できるエリア */
    .available {
      cursor: pointer;
    }

    /* 未解放のエリア */
    .locked {
      cursor: not-allowed;
    }

    /* =================================
       ジャンルに戻るボタン
       ================================= */

    .back-button {
      display: block;
      width: 280px;
      max-width: 60vw;
    }

    .back-button img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* =================================
       スマホ画面用の調整
       ================================= */

    @media (max-width: 600px) {

      .container {
        padding: 20px 10px;
        gap: 15px;
      }

      /* タイトルの大きさ */
      .title-image {
        width: 380px;
      }

      /* エリアボタンの大きさ */
      .area-button {
        width: 420px;
      }

      /* ボタン同士の間隔 */
      .area-list {
        gap: 10px;
      }

      /* 戻るボタンの大きさ */
      .back-button {
        width: 200px;
      }

    }

  </style>
</head>

<body>

  <!-- エリア選択画面全体 -->
  <main class="container">

    <!-- AREA SELECT タイトル -->
    <img
      src="images/area-title.png"
      alt="AREA SELECT"
      class="title-image">

    <!-- エリア選択ボタン一覧 -->
    <div class="area-list">

      <!-- 福岡市エリア：ゲーム画面に移動 -->
      <a href="ramen-game.html"
         class="area-button available">

        <img
          src="images/fukuoka-city-button.png"
          alt="福岡市エリア">

      </a>

      <!-- 未解放エリア 2 -->
      <div class="area-button locked">
        <img
          src="images/area-locked.png"
          alt="COMING SOON">
      </div>

      <!-- 未解放エリア 3 -->
      <div class="area-button locked">
        <img
          src="images/area-locked.png"
          alt="COMING SOON">
      </div>

      <!-- 未解放エリア 4 -->
      <div class="area-button locked">
        <img
          src="images/area-locked.png"
          alt="COMING SOON">
      </div>

    </div>

    <!-- ジャンル選択画面に戻る -->
    <a href="genre-select.html"
       class="back-button">

      <img
        src="images/genre-back.png"
        alt="ジャンルに戻る">

    </a>

  </main>

</body>
</html>
